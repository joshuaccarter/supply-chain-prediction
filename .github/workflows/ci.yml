name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Check code formatting (ruff)
        run: uv run ruff format --check .

      - name: Lint codebase (ruff)
        run: uv run ruff check .

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run test suite
        run: uv run pytest -v

  docker:
    name: Docker Build & Smoke Test
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: supply-chain-prediction:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify container healthcheck
        run: |
          docker run -d --name api-service -p 8000:8000 supply-chain-prediction:ci
          for i in $(seq 1 15); do
            if curl -fs http://localhost:8000/health > /dev/null; then
              echo "FastAPI health check passed!"
              curl -s http://localhost:8000/health
              break
            fi
            echo "Waiting for service to be healthy... ($i/15)"
            sleep 2
          done
          curl -fs http://localhost:8000/health || (echo "Health check failed. Container logs:" && docker logs api-service && exit 1)
          docker stop api-service
