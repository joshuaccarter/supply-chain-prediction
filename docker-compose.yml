services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: supply-chain-prediction-api:latest
    container_name: supply-chain-prediction-api
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=8000
      - WORKERS=2
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    volumes:
      # Optional read-only mount to update model artifacts without rebuilding the image
      - ./models:/app/models:ro
